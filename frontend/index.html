<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>budgety</title>
    <!--
      Applies the stored theme before the bundle loads. Doing this in React
      (even in a layout effect) still paints one light frame on a cold load.
      Key must match THEME_STORAGE_KEY in src/context/ThemeContext.ts.
    -->
    <script>
      try {
        if (localStorage.getItem("budgety:theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
