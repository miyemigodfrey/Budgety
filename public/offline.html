<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Offline — Budgety</title>
		<style>
			:root { color-scheme: light dark; }
			* { box-sizing: border-box; }
			body {
				margin: 0; min-height: 100dvh;
				display: flex; flex-direction: column; align-items: center; justify-content: center;
				gap: 18px; padding: 24px; text-align: center;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
				background: #eaf1fc; color: #0b1220;
			}
			@media (prefers-color-scheme: dark) { body { background: #080d18; color: #f3f5f9; } }
			.tile {
				width: 76px; height: 76px; border-radius: 20px;
				background: linear-gradient(150deg, #8fbcff, #2563eb 55%, #1d4ed8);
				display: grid; place-items: center;
				box-shadow: 0 16px 34px -14px rgba(37,99,235,.6);
			}
			h1 { font-size: 20px; margin: 4px 0 0; }
			p { margin: 0; max-width: 300px; color: #6b7280; font-size: 14px; line-height: 1.5; }
			@media (prefers-color-scheme: dark) { p { color: #9aa4b2; } }
			button {
				margin-top: 6px; border: 0; border-radius: 12px; padding: 11px 22px;
				background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="tile">
			<svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true">
				<rect x="7" y="17" width="34" height="23" rx="6" fill="#fff" />
				<rect x="27" y="25" width="16" height="9" rx="4.5" fill="#bcd6ff" />
				<circle cx="33" cy="29.5" r="2.4" fill="#fff" />
				<circle cx="24" cy="12" r="6" fill="#ffd24d" stroke="#fff" stroke-width="1.4" />
			</svg>
		</div>
		<h1>You're offline</h1>
		<p>Budgety needs a connection to load your spaces and transactions. Reconnect and try again.</p>
		<button onclick="location.reload()">Try again</button>
	</body>
</html>
